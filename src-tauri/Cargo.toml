[package]
name = "zz-board-desktop"
version = "0.11.0"
description = "Windows desktop runtime for the local-first ZZ Board"
authors = ["ZZ Board contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zz_board_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zz-board"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-single-instance = "2"
